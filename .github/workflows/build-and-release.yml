name: Build & Package SkyTray Weather

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build, Test & Package
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore WinuiWeatherForecastTray.slnx

      - name: Run Automated Tests
        run: dotnet test WinuiWeatherForecastTray.Tests/WinuiWeatherForecastTray.Tests.csproj --configuration Release --filter "Category!=Integration" --logger "console;verbosity=normal"

      # Hits the real Open-Meteo API: useful as an early warning if the API contract changes, but a flaky network
      # or a rate limit on the shared runner IP must not block a release.
      - name: Run Live API Contract Tests (non-blocking)
        continue-on-error: true
        run: dotnet test WinuiWeatherForecastTray.Tests/WinuiWeatherForecastTray.Tests.csproj --configuration Release --no-build --filter "Category=Integration" --logger "console;verbosity=normal"

      - name: Publish Standalone Release Build
        run: dotnet publish WinuiWeatherForecastTray/WinuiWeatherForecastTray.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o ./publish

      - name: Copy Installer Script to Package
        shell: powershell
        run: |
          Copy-Item -Path "Install-SkyTray.ps1" -Destination "./publish/Install-SkyTray.ps1" -Force

      - name: Compress Release Package (Zip)
        shell: powershell
        run: |
          Compress-Archive -Path "./publish/*" -DestinationPath "SkyTray-Weather-win-x64.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Build Executable Installer (Inno Setup)
        shell: powershell
        run: |
          $ver = if ("${{ github.ref_name }}" -like "v*") { "${{ github.ref_name }}" } else { "1.1.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer.iss

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkyTray-Weather-win-x64
          path: |
            SkyTray-Weather-win-x64.zip
            Output/SkyTrayWeather-Setup-x64.exe
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SkyTray-Weather-win-x64.zip
            Output/SkyTrayWeather-Setup-x64.exe
          name: SkyTray Weather Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
